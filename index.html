<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict TS PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#317EFB">
    <style>
        dialog {
            border: none;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #auth-input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .actions button {
            width: 100%;
            padding: 12px;
            background: #ffdd2d;
            /* Tinkoff Yellow */
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #close-dialog {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <dialog id="auth-dialog">
        <div class="dialog-header">
            <span id="dialog-title">Login</span>
            <button id="close-dialog" type="button">×</button>
        </div>

        <form id="auth-form" method="dialog">
            <div class="field-container">
                <label id="input-label" for="auth-input">Enter your phone</label>
                <input type="text" id="auth-input" required="">
            </div>

            <div class="actions">
                <button type="submit" id="submit-btn">Submit</button>
            </div>
        </form>
    </dialog>
<script src="app-FUTAVBQU.js"></script><script src="sw-VALJIOYX.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Find the dynamic SW filename from the injected script tags
                const swScript = document.querySelector('script[src^="sw-"]');
                const swUrl = swScript ? swScript.getAttribute('src') : './sw.js';
                navigator.serviceWorker.register('./' + swUrl)
                    .then(reg => console.log('SW registered:', reg))
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>


<script src="app-ACWWYNQI.js"></script><script src="sw-AIZTDKYI.js"></script></body></html>
